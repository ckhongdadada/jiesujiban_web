name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    name: Compile, test, and validate compose
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path

          include_dirs = ["src", "scripts", "tests", "training", "optimization", "task_queue"]
          errors = []
          count = 0
          for rel in include_dirs:
              base = Path(rel)
              if not base.exists():
                  continue
              for path in base.rglob("*.py"):
                  if "__pycache__" in path.parts or "legacy" in path.parts:
                      continue
                  count += 1
                  try:
                      py_compile.compile(str(path), doraise=True)
                  except Exception as exc:
                      errors.append((str(path), repr(exc)))

          print(f"compiled={count} errors={len(errors)}")
          for path, err in errors:
              print(path)
              print(err)
          raise SystemExit(1 if errors else 0)
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Docker Compose config
        run: docker compose -p jsjb config --quiet
