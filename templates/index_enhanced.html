<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接诉即办增强版</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #fffdfa;
      --ink: #1f2a37;
      --muted: #5b6470;
      --line: #d9d3c8;
      --accent: #8b3a2b;
      --accent-soft: #f7ece8;
      --gold: #9a7b2f;
      --gold-soft: #faf4e2;
      --green: #285943;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(139,58,43,.08), transparent 28%),
        linear-gradient(135deg, #f6f2ea 0%, #f0ebe2 100%);
      min-height: 100vh;
    }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .hero {
      padding: 28px;
      border: 1px solid var(--line);
      background: rgba(255,253,250,.88);
      backdrop-filter: blur(8px);
      box-shadow: 0 16px 40px rgba(63,50,38,.08);
      margin-bottom: 24px;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: 30px;
      letter-spacing: 1px;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 22px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(63,50,38,.06);
      padding: 22px;
    }
    .section-title {
      font-size: 18px;
      margin: 0 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 13px;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      font-size: 13px;
      color: var(--muted);
    }
    input, textarea, select, button {
      font: inherit;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
    }
    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.7;
    }
    button {
      border: none;
      border-radius: 10px;
      background: var(--ink);
      color: white;
      padding: 13px 18px;
      cursor: pointer;
      margin-top: 18px;
      width: 100%;
      transition: transform .15s ease, opacity .2s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .65; cursor: wait; }
    .panel {
      border: 1px solid var(--line);
      padding: 14px;
      background: #fff;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .panel h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--gold);
      margin-right: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .unit-row, .doc-row {
      border-top: 1px solid #eee4d6;
      padding: 10px 0;
    }
    .unit-row:first-child, .doc-row:first-child { border-top: none; }
    .unit-row.clickable {
      cursor: pointer;
      transition: background .15s, padding-left .2s;
      border-radius: 4px;
    }
    .unit-row.clickable:hover {
      background: var(--gold-soft);
      padding-left: 10px;
    }
    .unit-row.active {
      border-left: 3px solid var(--gold);
      padding-left: 10px;
      background: var(--gold-soft);
      font-weight: bold;
    }
    .score {
      color: var(--green);
      font-size: 12px;
    }
    .reply {
      white-space: pre-wrap;
      line-height: 1.8;
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      padding: 14px;
      border-radius: 8px;
    }
    .muted { color: var(--muted); }
    .error {
      background: #fff1f0;
      color: #a33a2c;
      border: 1px solid #efc8c3;
      padding: 12px 14px;
      border-radius: 8px;
      display: none;
      margin-top: 14px;
    }
    .health {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 25px; }
    }
    
    .skeleton {
      background: #eee4d6;
      background-image: linear-gradient(90deg, #eee4d6 0px, #fdfbf8 40px, #eee4d6 80px);
      background-size: 600px 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: 4px;
      height: 14px;
      margin-bottom: 8px;
    }
    .skeleton.title { width: 40%; height: 16px; margin-bottom: 12px; }
    .skeleton.line { width: 100%; }
    .skeleton.line.short { width: 75%; }
    .skeleton.para { height: 18px; margin-bottom: 10px; }
    @keyframes shimmer {
      0% { background-position: -300px 0; }
      100% { background-position: 300px 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1>接诉即办增强版</h1>
      <p>在原有“分类 + 回复生成”基础上，新增北京地名识别与区级归类，以及检索增强生成能力。当前页面由新文件驱动，不影响你原本的应用入口。</p>
    </section>

    <div class="grid">
      <section class="card">
        <h2 class="section-title"><span class="badge">1</span>输入留言</h2>
        <label for="tag">留言标签</label>
        <select id="tag">
          <option value="投诉/求助">投诉/求助</option>
          <option value="建议">建议</option>
          <option value="咨询">咨询</option>
          <option value="表扬">表扬</option>
        </select>

        <label for="title">留言标题</label>
        <input id="title" maxlength="100" placeholder="例如：夜间施工噪声持续扰民">

        <label for="body">留言正文</label>
        <textarea id="body" placeholder="请输入市民留言内容，尽量包含地点、时间、问题现象和诉求。"></textarea>

        <button id="submitBtn" onclick="analyzeMessage()">执行增强分析</button>
        <div class="error" id="errorBox"></div>
        <div class="health" id="healthBox">服务检测中...</div>
      </section>

      <section class="card">
        <h2 class="section-title"><span class="badge">2</span>分析结果</h2>

        <div class="panel">
          <h3>地名识别</h3>
          <div id="districtResult" class="muted">等待分析</div>
          <div id="placeList" style="margin-top:10px;"></div>
        </div>

        <div class="panel">
          <h3>单位预测</h3>
          <div id="unitList" class="muted">等待分析</div>
        </div>

        <div class="panel">
          <h3>RAG 检索结果</h3>
          <div id="docList" class="muted">等待分析</div>
        </div>

        <div class="panel">
          <h3>生成回复</h3>
          <div id="replyBox" class="reply muted">等待分析</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    let currentPayload = null;
    let currentUnits = [];
    let activeUnit = null;

    function setSkeletonLoading() {
      const skelObj = '<div class="skeleton title"></div><div class="skeleton line"></div><div class="skeleton line short"></div>';
      document.getElementById('districtResult').innerHTML = '<div class="skeleton line" style="width: 50%;"></div>';
      document.getElementById('placeList').innerHTML = '';
      document.getElementById('unitList').innerHTML = skelObj;
      document.getElementById('docList').innerHTML = skelObj + '<br>' + skelObj;
      document.getElementById('replyBox').innerHTML = '<div class="skeleton para"></div><div class="skeleton para"></div><div class="skeleton para" style="width: 70%;"></div>';
    }

    async function analyzeMessage() {
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '分析中...';
      setSkeletonLoading();

      const payload = {
        tag: document.getElementById('tag').value,
        title: document.getElementById('title').value.trim(),
        body: document.getElementById('body').value.trim()
      };
      currentPayload = payload;

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '请求失败');
        renderResult(data);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '执行增强分析';
      }
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderResult(data) {
      const location = data.location || {};
      const retrieval = data.retrieval || [];
      const units = data.units || [];

      document.getElementById('districtResult').innerHTML = location.district
        ? `识别行政区：<strong>${escapeHTML(location.district)}</strong> <span class="score">置信度 ${escapeHTML(location.confidence) || 0}</span> <span class="muted">来源 ${escapeHTML(location.method) || 'unknown'}</span>`
        : '未识别到稳定行政区，可继续补充道路、小区、街道等信息。';

      const placeList = document.getElementById('placeList');
      placeList.innerHTML = (location.places || []).length
        ? location.places.map(item => `<span class="pill">${escapeHTML(item.matched_text)} -> ${escapeHTML(item.district)}</span>`).join('')
        : '<span class="muted">无命中地名</span>';

      currentUnits = units;
      activeUnit = units.length > 0 ? units[0].unit : null;
      renderUnitsList();

      const docList = document.getElementById('docList');
      docList.innerHTML = retrieval.length
        ? retrieval.map(item => `
            <div class="doc-row">
              <div><strong>${escapeHTML(item.title)}</strong> <span class="score">score ${escapeHTML(item.score)}</span></div>
              <div class="muted">${escapeHTML(item.doc_type)} | ${escapeHTML(item.district) || '全市'} | ${escapeHTML(item.source)}</div>
              <div class="muted">${escapeHTML(item.snippet)}</div>
            </div>`).join('')
        : '<span class="muted">当前知识库没有检索到高相关材料</span>';

      document.getElementById('replyBox').textContent = data.reply || '暂无回复';
    }

    function renderUnitsList() {
      const unitList = document.getElementById('unitList');
      if (!currentUnits || currentUnits.length === 0) {
        unitList.innerHTML = '<span class="muted">无单位预测结果</span>';
        return;
      }
      unitList.innerHTML = currentUnits.map(item => {
        const safeUnitAttr = escapeHTML(item.unit).replace(/'/g, "\\'");
        return `
        <div class="unit-row clickable ${item.unit === activeUnit ? 'active' : ''}" onclick="selectUnit('${safeUnitAttr}')">
          <strong>${escapeHTML(item.unit)}</strong> <span class="score">${escapeHTML(item.confidence)}%</span>
        </div>`;
      }).join('');
    }

    async function selectUnit(unitName) {
      if (!currentPayload || unitName === activeUnit) return;
      activeUnit = unitName;
      renderUnitsList();
      
      const docList = document.getElementById('docList');
      const replyBox = document.getElementById('replyBox');
      
      const skelObj = '<div class="skeleton title"></div><div class="skeleton line"></div><div class="skeleton line short"></div>';
      docList.innerHTML = skelObj + '<br>' + skelObj;
      replyBox.innerHTML = '<div class="skeleton para"></div><div class="skeleton para"></div><div class="skeleton para" style="width: 70%;"></div>';

      try {
        const payload = { ...currentPayload, _force_unit: unitName };
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '重生成失败');
        
        const retrieval = data.retrieval || [];
        docList.innerHTML = retrieval.length
          ? retrieval.map(item => `
              <div class="doc-row">
                <div><strong>${escapeHTML(item.title)}</strong> <span class="score">score ${escapeHTML(item.score)}</span></div>
                <div class="muted">${escapeHTML(item.doc_type)} | ${escapeHTML(item.district) || '全市'} | ${escapeHTML(item.source)}</div>
                <div class="muted">${escapeHTML(item.snippet)}</div>
              </div>`).join('')
          : '<span class="muted">当前知识库没有检索到高相关材料</span>';
          
        replyBox.textContent = data.reply || '暂无回复';
      } catch (err) {
        docList.innerHTML = `<span class="error" style="display:block">检索失败: ${escapeHTML(err.message)}</span>`;
        replyBox.innerHTML = `<span class="error" style="display:block">生成失败: ${escapeHTML(err.message)}</span>`;
      }
    }

    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        const text = `分类模型: ${data.classifier_ready ? '已加载' : '未加载'} | 生成模型: ${data.generator_ready ? '已加载' : '未加载'} | 检索后端: ${data.retrieval?.active_backend || 'unknown'} | 设备: ${data.device}`;
        document.getElementById('healthBox').textContent = text;
      } catch (err) {
        document.getElementById('healthBox').textContent = '健康检查失败，请确认增强版服务已启动。';
      }
    }

    checkHealth();
  </script>
</body>
</html>
